[package]
name = "bicara-stt"
version = "0.1.0"
edition = "2021"
description = "Live speech-to-text for BICARA: resampling, VAD segmentation, whisper.cpp engine"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16" }

[dev-dependencies]
hound = "3"
