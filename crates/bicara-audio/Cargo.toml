[package]
name = "bicara-audio"
version = "0.1.0"
edition = "2021"
description = "Per-application audio capture (macOS Core Audio taps, Windows WASAPI process loopback) + mic capture"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cpal = "0.16"

[target.'cfg(windows)'.dependencies]
wasapi = "0.19"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[build-dependencies]
cc = "1"

[dev-dependencies]
hound = "3"
