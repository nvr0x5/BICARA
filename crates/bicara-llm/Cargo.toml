[package]
name = "bicara-llm"
version = "0.1.0"
edition = "2021"
description = "LLM providers for BICARA: Claude/Codex subscription CLIs, Anthropic API, OpenAI-compatible APIs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
